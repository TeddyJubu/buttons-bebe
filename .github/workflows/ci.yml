name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Install declared Python environments
        run: |
          uv sync --project webhook --locked
          uv sync --project processor --locked
          uv venv .inbox-venv --python 3.12
          uv pip install --python .inbox-venv/bin/python --require-hashes -r console-src/inbox/requirements-test.lock
          uv venv .qa-venv --python 3.12
          uv pip sync --python .qa-venv/bin/python --require-hashes testing/requirements-qa.lock
          uv venv .gate-venv --python 3.12
          uv pip sync --python .gate-venv/bin/python --require-hashes kb/requirements.lock
          uv venv .tools-venv --python 3.12
          uv pip sync --python .tools-venv/bin/python --require-hashes tools/requirements.lock
      - name: Verify installed runtime receipts and MCP parity
        run: |
          .gate-venv/bin/python tools/verify_runtime_lock.py kb/requirements.lock
          .tools-venv/bin/python tools/verify_runtime_lock.py tools/requirements.lock
          PYTHONPATH=testing .gate-venv/bin/python -m unittest testing/test_production_mcp_metadata.py -v
          PYTHONPATH=testing .tools-venv/bin/python -m unittest testing/test_production_mcp_metadata.py -v
      - name: Install ripgrep (required by the release gate)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep caddy
      - name: Run offline release gate
        env:
          PYTHON: .gate-venv/bin/python
          HERMES_VERIFY_PYTHON: .gate-venv/bin/python
          WEBHOOK_PYTHON: webhook/.venv/bin/python
          PROCESSOR_PYTHON: processor/.venv/bin/python
          INBOX_PYTHON: .inbox-venv/bin/python
          QA_PYTHON: .qa-venv/bin/python
        run: bash tools/verify_release.sh

  whatsapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-connect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: whatsapp-connect/package-lock.json
      - run: npm ci
      - run: npm test
